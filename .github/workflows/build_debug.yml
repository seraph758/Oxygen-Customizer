name: Build Nightly Release APK

on:
  push:
    branches: [ "nightly" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Nightly Release
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission to gradlew
        run: chmod +x gradlew

      - name: Build Nightly Release APK
        run: ./gradlew assembleNightlyRelease

      - name: Upload Nightly APK
        uses: actions/upload-artifact@v4
        with:
          name: "Nightly-Release-APK"
          path: app/build/outputs/apk/nightly/release/*.apk
          if-no-files-found: error
